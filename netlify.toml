[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "src/netlify/functions"
  node_bundler = "esbuild"

# Kein SPA-Fallback mehr ("/*" -> index.html): Jede Seite liegt vorgerendert in dist/.
# Unbekannte Adressen bekommen dist/404.html mit echtem Status 404 statt 200.

# Gehashte Build-Dateien (JS, CSS, Schriften) ändern bei jeder Änderung ihren Namen
# und dürfen deshalb dauerhaft im Browser-Cache bleiben.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
